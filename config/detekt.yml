style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    active: false
  # early returns are the house style; six is the current maximum
  ReturnCount:
    max: 6

complexity:
  TooManyFunctions:
    allowedFunctionsPerFile: 25
    # the game class owns every round rule (draw, takeback, resign, …); forty is the current maximum
    allowedFunctionsPerClass: 40
  # the game's settings are passed as parameters, not wrapped in a config object; nine is the current maximum
  LongParameterList:
    allowedFunctionParameters: 9
    allowedConstructorParameters: 9
  # a when that only maps values to strings is not branchy logic
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true

coroutines:
  # no DI container here: each game/lobby scope owns its dispatcher
  InjectDispatcher:
    active: false

empty-blocks:
  # BotSession's WebSocketSession overrides are intentionally no-ops
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: false
